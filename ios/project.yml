name: AuthorScrolls
options:
  bundleIdPrefix: com.authorscrolls
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AuthorScrolls:
    type: application
    platform: iOS
    sources:
      - path: AuthorScrolls
    entitlements:
      path: AuthorScrolls/AuthorScrolls.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:authorscrolls.com
          - applinks:www.authorscrolls.com
    info:
      path: AuthorScrolls/Info.plist
      properties:
        CFBundleDisplayName: AuthorScrolls
        CFBundleName: AuthorScrolls
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        WKAppBoundDomains:
          - authorscrolls.com
          - www.authorscrolls.com
          - writers-manuscript.firebaseapp.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.authorscrolls.app
        PRODUCT_NAME: AuthorScrolls
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        SWIFT_STRICT_CONCURRENCY: minimal
