<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthorScrolls - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0705;color:#e8dfd4;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,7,5,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(200,149,108,.12);padding:.55rem 2rem;display:flex;justify-content:space-between;align-items:center}
.nb{display:flex;align-items:center;gap:.4rem;font-family:'Lora',serif;font-size:1.1rem;font-weight:700;color:#dbb08a;text-decoration:none}
.nav-links{display:flex;gap:.7rem;align-items:center}
.nav-links a{color:#9c9085;font-size:.82rem;text-decoration:none}
.nav-links a:hover{color:#dbb08a}

.container{max-width:600px;margin:80px auto 40px;padding:0 1.5rem}
h1{font-family:'Lora',serif;font-size:1.8rem;color:#dbb08a;margin-bottom:1.5rem}

.profile-card{background:linear-gradient(145deg,#1e1812,#151010);border:1px solid rgba(200,149,108,.15);border-radius:14px;padding:2rem;margin-bottom:1.5rem}
.avatar-section{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(200,149,108,.1)}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#c8956c,#8a6548);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;font-weight:700;cursor:pointer;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-upload{position:absolute;bottom:-2px;right:-2px;background:#c8956c;color:#fff;width:22px;height:22px;border-radius:50%;font-size:.65rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #1e1812}
.user-info h2{font-family:'Lora',serif;font-size:1.2rem;color:#e8dfd4}
.user-info p{font-size:.8rem;color:#9c9085}

.field{margin-bottom:1rem}
.field label{display:block;font-size:.75rem;color:#9c9085;margin-bottom:.3rem;font-weight:600}
.field input,.field select{width:100%;padding:.55rem .7rem;background:#1a1510;border:1px solid #3a3330;border-radius:7px;color:#e8dfd4;font-size:.85rem;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:#c8956c}

.btn{padding:.55rem 1.2rem;border-radius:7px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.3s;border:none}
.btn-primary{background:linear-gradient(135deg,#c8956c,#8a6548);color:#fff}
.btn-primary:hover{box-shadow:0 0 18px rgba(255,200,120,.3)}
.btn-outline{background:transparent;border:1px solid #3a3330;color:#9c9085}
.btn-outline:hover{border-color:#c8956c;color:#dbb08a}
.btn-danger{background:#3a1010;border:1px solid #c45c4a;color:#c45c4a}
.btn-danger:hover{background:#4a1515}

.section{margin-bottom:1.5rem}
.section h3{font-family:'Lora',serif;font-size:1rem;color:#dbb08a;margin-bottom:.6rem}
.section p{font-size:.8rem;color:#9c9085;line-height:1.5;margin-bottom:.5rem}

.tier-badge{display:inline-block;padding:.15rem .6rem;border-radius:4px;font-size:.7rem;font-weight:700;letter-spacing:.5px}
.tier-free{background:#2a2520;color:#9c9085}
.tier-starter{background:#2a2010;color:#d4a855}
.tier-premium{background:#1a1530;color:#a28cd0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:.8rem}
.stat{background:#1a1510;border:1px solid #3a3330;border-radius:8px;padding:.6rem;text-align:center}
.stat-num{font-size:1.3rem;font-weight:700;color:#dbb08a}
.stat-label{font-size:.65rem;color:#9c9085;margin-top:.15rem}

.pref-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid rgba(200,149,108,.06)}
.pref-row label{font-size:.82rem;color:#e8dfd4}
.toggle{position:relative;width:38px;height:20px;cursor:pointer}
.toggle input{display:none}
.toggle span{position:absolute;inset:0;background:#3a3330;border-radius:10px;transition:.3s}
.toggle span::before{content:'';position:absolute;width:16px;height:16px;background:#9c9085;border-radius:50%;top:2px;left:2px;transition:.3s}
.toggle input:checked+span{background:#c8956c}
.toggle input:checked+span::before{transform:translateX(18px);background:#fff}

.footer{text-align:center;padding:2rem;color:#6b6158;font-size:.75rem}
.footer a{color:#9c9085;text-decoration:none}

#login-gate{display:flex;align-items:center;justify-content:center;height:60vh;text-align:center}
.login-prompt{color:#9c9085;font-size:.9rem}
.login-prompt a{color:#dbb08a;text-decoration:underline}
</style>
</head>
<body>
<nav>
  <a class="nb" href="index.html"><span>&#127807;</span> AuthorScrolls</a>
  <div class="nav-links"><a href="app.html">Editor</a><a href="pricing.html">Pricing</a></div>
</nav>

<div class="container">
  <div id="login-gate"><div class="login-prompt">Please <a href="index.html">sign in</a> to view your profile.</div></div>

  <div id="profile-content" style="display:none">
    <h1>Your Profile</h1>

    <div class="profile-card">
      <div class="avatar-section">
        <div class="avatar" id="avatar-display" title="Click to change photo">
          <span id="avatar-letter">?</span>
          <input type="file" id="avatar-input" accept="image/*" hidden>
          <div class="avatar-upload">&#9998;</div>
        </div>
        <div class="user-info">
          <h2 id="profile-name">User</h2>
          <p id="profile-email">user@email.com</p>
          <span class="tier-badge tier-free" id="tier-badge">FREE</span>
        </div>
      </div>

      <div class="field">
        <label>Display Name</label>
        <input type="text" id="edit-name" placeholder="Your name">
      </div>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-primary" id="save-profile">Save Changes</button>
        <button class="btn btn-outline" id="reset-profile">Cancel</button>
      </div>
    </div>

    <div class="profile-card">
      <div class="section">
        <h3>Writing Stats</h3>
        <div class="stats">
          <div class="stat"><div class="stat-num" id="stat-manuscripts">0</div><div class="stat-label">Manuscripts</div></div>
          <div class="stat"><div class="stat-num" id="stat-words">0</div><div class="stat-label">Words Analyzed</div></div>
          <div class="stat"><div class="stat-num" id="stat-fixes">0</div><div class="stat-label">Issues Fixed</div></div>
        </div>
      </div>
    </div>

    <div class="profile-card">
      <div class="section">
        <h3>Preferences</h3>
        <div class="pref-row"><label>Auto-save manuscripts</label><label class="toggle"><input type="checkbox" id="pref-autosave" checked><span></span></label></div>
        <div class="pref-row"><label>Show cookie banner</label><label class="toggle"><input type="checkbox" id="pref-cookies"><span></span></label></div>
        <div class="pref-row"><label>Dark theme (default)</label><label class="toggle"><input type="checkbox" id="pref-theme" checked><span></span></label></div>
        <div class="pref-row">
          <label>Default genre</label>
          <select id="pref-genre" style="width:auto;padding:.3rem .5rem;background:#1a1510;border:1px solid #3a3330;border-radius:5px;color:#e8dfd4;font-size:.75rem">
            <option value="">Auto-detect</option>
            <option value="fantasy">Fantasy</option>
            <option value="scifi">Science Fiction</option>
            <option value="romance">Romance</option>
            <option value="thriller">Thriller</option>
            <option value="mystery">Mystery</option>
            <option value="literary">Literary Fiction</option>
            <option value="ya">Young Adult</option>
            <option value="horror">Horror</option>
            <option value="historical">Historical Fiction</option>
          </select>
        </div>
      </div>
    </div>

    <div class="profile-card">
      <div class="section">
        <h3>Subscription</h3>
        <p id="sub-status">You're on the <strong>Free</strong> plan.</p>
        <div style="display:flex;gap:.5rem;margin-top:.5rem">
          <a href="pricing.html"><button class="btn btn-primary">Upgrade Plan</button></a>
        </div>
      </div>
    </div>

    <div class="profile-card">
      <div class="section">
        <h3>Account Actions</h3>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn btn-outline" id="signout-btn">Sign Out</button>
          <button class="btn btn-outline" id="clear-data-btn">Clear Local Data</button>
          <button class="btn btn-danger" id="delete-account-btn">Delete Account</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <p>AuthorScrolls &middot; &copy; 2026</p>
  <p style="margin-top:.3rem"><a href="legal.html#terms">Terms</a> &middot; <a href="legal.html#privacy">Privacy</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBkLqqoxn7gkE9EBvGeuRz54-7xEN9dAWI",authDomain:"writers-manuscript.firebaseapp.com",projectId:"writers-manuscript",storageBucket:"writers-manuscript.appspot.com",messagingSenderId:"420138585851",appId:"1:420138585851:web:09c683cf202c9dde50aa5e"});
const auth=firebase.auth();

auth.onAuthStateChanged(user=>{
  if(!user){document.getElementById('login-gate').style.display='flex';document.getElementById('profile-content').style.display='none';return}
  document.getElementById('login-gate').style.display='none';
  document.getElementById('profile-content').style.display='block';

  // Populate profile
  const name=user.displayName||user.email.split('@')[0];
  document.getElementById('profile-name').textContent=name;
  document.getElementById('profile-email').textContent=user.email;
  document.getElementById('avatar-letter').textContent=name[0].toUpperCase();
  document.getElementById('edit-name').value=user.displayName||'';

  // Load avatar from localStorage
  const savedAvatar=localStorage.getItem('ml_avatar');
  if(savedAvatar){
    const img=document.createElement('img');img.src=savedAvatar;
    document.getElementById('avatar-display').prepend(img);
    document.getElementById('avatar-letter').style.display='none';
  }

  // Stats from localStorage
  const versions=JSON.parse(localStorage.getItem('ml_versions')||'[]');
  document.getElementById('stat-manuscripts').textContent=versions.length;
  const totalWords=versions.reduce((s,v)=>s+(v.wordCount||0),0);
  document.getElementById('stat-words').textContent=totalWords>1000?(totalWords/1000).toFixed(1)+'k':totalWords;
  document.getElementById('stat-fixes').textContent=localStorage.getItem('ml_fixes_count')||'0';

  // Load preferences
  const prefs=JSON.parse(localStorage.getItem('ml_prefs')||'{}');
  document.getElementById('pref-autosave').checked=prefs.autosave!==false;
  document.getElementById('pref-cookies').checked=prefs.showCookies||false;
  document.getElementById('pref-theme').checked=prefs.darkTheme!==false;
  if(prefs.defaultGenre)document.getElementById('pref-genre').value=prefs.defaultGenre;
});

// Save profile
document.getElementById('save-profile').addEventListener('click',async()=>{
  const user=auth.currentUser;if(!user)return;
  const newName=document.getElementById('edit-name').value.trim();
  if(newName){await user.updateProfile({displayName:newName});document.getElementById('profile-name').textContent=newName;document.getElementById('avatar-letter').textContent=newName[0].toUpperCase()}
  // Save preferences
  const prefs={
    autosave:document.getElementById('pref-autosave').checked,
    showCookies:document.getElementById('pref-cookies').checked,
    darkTheme:document.getElementById('pref-theme').checked,
    defaultGenre:document.getElementById('pref-genre').value
  };
  localStorage.setItem('ml_prefs',JSON.stringify(prefs));
  alert('Profile saved!');
});

document.getElementById('reset-profile').addEventListener('click',()=>{
  const user=auth.currentUser;if(!user)return;
  document.getElementById('edit-name').value=user.displayName||'';
});

// Avatar upload
document.getElementById('avatar-display').addEventListener('click',()=>document.getElementById('avatar-input').click());
document.getElementById('avatar-input').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  if(file.size>500*1024){alert('Image too large (max 500KB)');return}
  const reader=new FileReader();
  reader.onload=ev=>{
    localStorage.setItem('ml_avatar',ev.target.result);
    const existing=document.getElementById('avatar-display').querySelector('img');
    if(existing)existing.src=ev.target.result;
    else{const img=document.createElement('img');img.src=ev.target.result;document.getElementById('avatar-display').prepend(img);document.getElementById('avatar-letter').style.display='none'}
  };
  reader.readAsDataURL(file);
});

// Sign out
document.getElementById('signout-btn').addEventListener('click',()=>{
  auth.signOut();window.location.href='index.html';
});

// Clear data
document.getElementById('clear-data-btn').addEventListener('click',()=>{
  if(confirm('Clear all local data? This removes auto-saves, preferences, and cached analyses.')){
    localStorage.clear();sessionStorage.clear();alert('Data cleared.');window.location.reload();
  }
});

// Delete account
document.getElementById('delete-account-btn').addEventListener('click',async()=>{
  if(!confirm('Permanently delete your account? This cannot be undone.'))return;
  if(!confirm('Are you really sure? All manuscripts and data will be lost.'))return;
  try{await auth.currentUser.delete();localStorage.clear();sessionStorage.clear();window.location.href='index.html'}
  catch(e){if(e.code==='auth/requires-recent-login'){alert('For security, please sign out and sign back in before deleting your account.')}else alert(e.message)}
});
</script>
</body>
</html>
